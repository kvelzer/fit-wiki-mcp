[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fitwiki-mcp"
version = "0.1.0"
description = "Read-only FIT Wiki MCP server with local OCR and client vision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3", "requests>=2.32,<3", "beautifulsoup4>=4.13,<5",
  "markdownify>=1.2,<2", "python-dotenv>=1.1,<2", "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
fitwiki-mcp = "fitwiki_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: authenticated network tests (opt-in)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
